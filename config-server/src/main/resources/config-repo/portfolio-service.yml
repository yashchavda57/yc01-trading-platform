server:
  port: 8085

spring:
  application:
    name: portfolio-service
  datasource:
    url: jdbc:postgresql://localhost:5432/trading_portfolios
    username: ${DB_USERNAME:trading_user}
    password: ${DB_PASSWORD:trading_pass}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: portfolio-service
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

# CLAUDE.md's multi-level cache spec for this service: Caffeine (L1, 30s) -> Redis (L2, 5min).
portfolio:
  cache:
    l1-ttl-seconds: 30
    l2-ttl-minutes: 5

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
